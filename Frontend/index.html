<script>
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const tabId = tab.getAttribute('data-tab');

            document.querySelectorAll('.tab').forEach(t => {
                t.classList.remove('active-tab');
            });
            tab.classList.add('active-tab');

            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
        });
    });

    function showInterfaceFields() {
        const type = document.getElementById('interfaceType').value;

        document.getElementById('apiFields').classList.add('hidden');
        document.getElementById('dbFields').classList.add('hidden');
        document.getElementById('kafkaFields').classList.add('hidden');

        if (type === 'Api') document.getElementById('apiFields').classList.remove('hidden');
        if (type === 'Database') document.getElementById('dbFields').classList.remove('hidden');
        if (type === 'Kafka') document.getElementById('kafkaFields').classList.remove('hidden');
    }

    async function publishInterface() {
        const resultDiv = document.getElementById('publishResult');
        resultDiv.classList.add('hidden');

        const productName = document.getElementById('productName').value;
        const interfaceName = document.getElementById('interfaceName').value;
        const interfaceType = document.getElementById('interfaceType').value;

        if (!productName || !interfaceName || !interfaceType) {
            showResult('Please fill in all required fields', 'error');
            return;
        }

        const request = {
            Name: interfaceName,
            ProductName: productName,
            InterfaceType: interfaceType,
            Description: document.getElementById('description').value,
            Host: document.getElementById('host')?.value,
            Port: document.getElementById('port')?.value,
            Endpoint: document.getElementById('endpoint')?.value,
            Username: document.getElementById('username')?.value,
            Password: document.getElementById('password')?.value,
            Token: document.getElementById('token')?.value,
            DatabaseName: document.getElementById('dbName')?.value,
            Scheme: document.getElementById('dbSchema')?.value,
            BootstrapServers: document.getElementById('bootstrapServers')?.value,
            TopicName: document.getElementById('topicName')?.value
        };

        try {
            const response = await fetch('http://localhost:5001/api/publication/interfaces', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(request)
            });

            if (response.ok) {
                const result = await response.json();
                showResult(`Interface published successfully! ID: ${result.interfaceId}`, 'success');
                clearForm();
                loadRecentInterfaces();
            } else {
                const error = await response.text();
                showResult(`Error: ${error}`, 'error');
            }
        } catch (error) {
            showResult(`Network error: ${error.message}`, 'error');
        }
    }

    function showResult(message, type) {
        const resultDiv = document.getElementById('publishResult');
        resultDiv.innerHTML = message;
        resultDiv.className = type === 'success'
            ? 'mt-4 p-3 rounded bg-green-100 text-green-700 border border-green-300'
            : 'mt-4 p-3 rounded bg-red-100 text-red-700 border border-red-300';
        resultDiv.classList.remove('hidden');
    }

    async function loadRecentInterfaces() {
        try {
            const response = await fetch('http://localhost:5001/api/publication/interfaces/recent');
            if (response.ok) {
                const interfaces = await response.json();
                displayRecentInterfaces(interfaces);
            }
        } catch (error) {
            console.error('Failed to load recent interfaces:', error);
        }
    }

    function displayRecentInterfaces(interfaces) {
        const container = document.getElementById('recentInterfaces');

        if (interfaces.length === 0) {
            container.innerHTML = '<div class="text-gray-500 text-center">No interfaces published yet</div>';
            return;
        }

        container.innerHTML = interfaces.map(intf => `
                <div class="border rounded-lg p-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-semibold">${intf.name}</h3>
                            <p class="text-sm text-gray-600">${intf.description || 'No description'}</p>
                        </div>
                        <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">
                            ${intf.interfaceType}
                        </span>
                    </div>
                    <div class="text-xs text-gray-500 mt-2">
                        Product: ${intf.productName} • Status: ${intf.status}
                    </div>
                </div>
            `).join('');
    }

    async function searchInterfaces() {
        const productName = document.getElementById('productSearch').value;
        const interfaceName = document.getElementById('interfaceSearch').value;
        const interfaceType = document.getElementById('typeSearch').value;

        try {
            const response = await fetch(`http://localhost:5002/api/search/interfaces/advanced?` +
                `productName=${encodeURIComponent(productName)}&` +
                `interfaceName=${encodeURIComponent(interfaceName)}&` +
                `interfaceType=${encodeURIComponent(interfaceType)}`);

            const results = await response.json();
            displayResults(results);
        } catch (error) {
            document.getElementById('searchResults').innerHTML =
                `<div class="text-red-500">Error: ${error.message}</div>`;
        }
    }

    function displayResults(results) {
        const container = document.getElementById('searchResults');

        if (results.length === 0) {
            container.innerHTML = '<div class="text-gray-500 text-center">No interfaces found.</div>';
            return;
        }

        container.innerHTML = results.map(intf => `
                <div class="border rounded-lg p-4">
                    <h3 class="font-semibold">${intf.name}</h3>
                    <p class="text-gray-600">${intf.description || 'No description'}</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm">
                            ${intf.interfaceType}
                        </span>
                        <span class="bg-green-100 text-green-800 px-2 py-1 rounded text-sm">
                            ${intf.productName}
                        </span>
                        <span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-sm">
                            ${intf.connectionStatus}
                        </span>
                    </div>
                    <button onclick="subscribeToInterface(${intf.id})" 
                            class="mt-2 bg-purple-500 hover:bg-purple-600 text-white px-3 py-1 rounded text-sm">
                        Subscribe
                    </button>
                </div>
            `).join('');
    }

    function subscribeToInterface(interfaceId) {
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.remove('active-tab');
        });
        document.querySelector('[data-tab="subscription"]').classList.add('active-tab');

        document.querySelectorAll('.section').forEach(section => {
            section.classList.remove('active');
        });
        document.getElementById('subscription').classList.add('active');

        alert(`Subscribing to interface ID: ${interfaceId}`);
    }

    async function saveOrchestrationConfig() {
        const config = {
            ScheduleCron: document.getElementById('scheduleCron').value,
            MaxRetryAttempts: parseInt(document.getElementById('maxRetryAttempts').value),
            RetryDelaySeconds: parseInt(document.getElementById('retryDelaySeconds').value),
            ExecutionTimeoutSeconds: parseInt(document.getElementById('executionTimeoutSeconds').value)
        };

        try {
            const response = await fetch('http://localhost:5003/api/subscription/orchestration/config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(config)
            });

            if (response.ok) {
                document.getElementById('configResult').innerHTML =
                    '<div class="bg-green-100 text-green-700 p-3 rounded">Configuration saved successfully!</div>';
                document.getElementById('configResult').classList.remove('hidden');
            } else {
                document.getElementById('configResult').innerHTML =
                    '<div class="bg-red-100 text-red-700 p-3 rounded">Error saving configuration</div>';
                document.getElementById('configResult').classList.remove('hidden');
            }
        } catch (error) {
            document.getElementById('configResult').innerHTML =
                `<div class="bg-red-100 text-red-700 p-3 rounded">Network error: ${error.message}</div>`;
            document.getElementById('configResult').classList.remove('hidden');
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        showInterfaceFields();
        loadRecentInterfaces();
    });
</script>
