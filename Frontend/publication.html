<!DOCTYPE html>
<html lang="en">
<head>
    <title>Publication Service - Integration Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-6">
    <header class="mb-8">
        <a href="/index.html" class="text-blue-500 hover:text-blue-700">Back to Home</a>
        <h1 class="text-3xl font-bold mt-4">Publication Service</h1>
        <nav class="flex space-x-4 mt-4">
            <a href="/publication.html" class="bg-blue-100 text-blue-800 px-3 py-1 rounded">Publication</a>
            <a href="/search.html" class="text-blue-500 hover:text-blue-700 px-3 py-1">Discovery</a>
<!--            <a href="/subscription.html" class="text-blue-500 hover:text-blue-700 px-3 py-1">Subscription</a>-->
        </nav>
    </header>

    <div class="bg-white p-6 rounded-lg shadow mb-8">
        <h2 class="text-xl font-semibold mb-4">Publish New Interface</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium mb-1">Product Name *</label>
                <label for="productName"></label><input type="text" id="productName" placeholder="e.g., UserService" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Interface Name *</label>
                <label for="interfaceName"></label><input type="text" id="interfaceName" placeholder="e.g., UserEvents API" class="w-full p-2 border rounded" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Description</label>
            <textarea id="description" placeholder="Describe the purpose of this interface..." class="w-full p-2 border rounded" rows="2"></textarea>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Interface Type *</label>
            <label for="interfaceType"></label><select id="interfaceType" class="w-full p-2 border rounded" onchange="showInterfaceFields()">
                <option value="">Select Interface Type</option>
                <option value="Api">REST API</option>
                <option value="Database">Database</option>
                <option value="Kafka">Kafka Topic</option>
            </select>
        </div>

        <div id="apiFields" class="hidden space-y-3 mb-4">
            <h3 class="font-semibold text-gray-700">API Configuration</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Host</label>
                    <label for="host"></label><input type="text" id="host" placeholder="e.g., api.example.com" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Port</label>
                    <label for="port"></label><input type="text" id="port" placeholder="e.g., 443" class="w-full p-2 border rounded">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium mb-1">Endpoint</label>
                    <label for="endpoint"></label><input type="text" id="endpoint" placeholder="e.g., /api/v1/users" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <label for="username"></label><input type="text" id="username" placeholder="API username" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <label for="password"></label><input type="password" id="password" placeholder="API password" class="w-full p-2 border rounded">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium mb-1">Token (optional)</label>
                    <label for="token"></label><input type="text" id="token" placeholder="Bearer token" class="w-full p-2 border rounded">
                </div>
            </div>
        </div>

        <div id="dbFields" class="hidden space-y-3 mb-4">
            <h3 class="font-semibold text-gray-700">Database Configuration</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Host</label>
                    <label for="dbHost"></label><input type="text" id="dbHost" placeholder="e.g., database.server.com" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Port</label>
                    <label for="dbPort"></label><input type="text" id="dbPort" placeholder="e.g., 5432" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Database Name</label>
                    <label for="dbName"></label><input type="text" id="dbName" placeholder="e.g., production_db" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Schema</label>
                    <label for="dbSchema"></label><input type="text" id="dbSchema" placeholder="e.g., public" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <label for="dbUsername"></label><input type="text" id="dbUsername" placeholder="Database user" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <label for="dbPassword"></label><input type="password" id="dbPassword" placeholder="Database password" class="w-full p-2 border rounded">
                </div>
            </div>
        </div>

        <div id="kafkaFields" class="hidden space-y-3 mb-4">
            <h3 class="font-semibold text-gray-700">Kafka Configuration</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium mb-1">Bootstrap Servers</label>
                    <label for="bootstrapServers"></label><input type="text" id="bootstrapServers" placeholder="e.g., kafka1:9092,kafka2:9092" class="w-full p-2 border rounded">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium mb-1">Topic Name</label>
                    <label for="topicName"></label><input type="text" id="topicName" placeholder="e.g., user-events" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <label for="kafkaUsername"></label><input type="text" id="kafkaUsername" placeholder="Kafka user" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <label for="kafkaPassword"></label><input type="password" id="kafkaPassword" placeholder="Kafka password" class="w-full p-2 border rounded">
                </div>
            </div>
        </div>

        <div class="flex space-x-4">
            <button onclick="publishInterface()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded">
                Publish Interface
            </button>
            <button onclick="clearForm()" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded">
                Clear Form
            </button>
        </div>

        <div id="publishResult" class="mt-4 p-3 rounded hidden"></div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-semibold mb-4">Recently Published Interfaces</h2>
        <div id="recentInterfaces" class="space-y-3">
            <div class="text-gray-500 text-center">No interfaces published yet</div>
        </div>
    </div>
</div>

<script>
    function showInterfaceFields() {
        const type = document.getElementById('interfaceType').value;

        document.getElementById('apiFields').classList.add('hidden');
        document.getElementById('dbFields').classList.add('hidden');
        document.getElementById('kafkaFields').classList.add('hidden');

        if (type === 'Api') document.getElementById('apiFields').classList.remove('hidden');
        if (type === 'Database') document.getElementById('dbFields').classList.remove('hidden');
        if (type === 'Kafka') document.getElementById('kafkaFields').classList.remove('hidden');
    }

    function clearForm() {
        document.getElementById('productName').value = '';
        document.getElementById('interfaceName').value = '';
        document.getElementById('description').value = '';
        document.getElementById('interfaceType').value = '';

        const allInputs = document.querySelectorAll('input');
        allInputs.forEach(input => {
            if (input.type !== 'button') input.value = '';
        });

        showInterfaceFields();
        document.getElementById('publishResult').classList.add('hidden');
    }

    async function publishInterface() {
        const resultDiv = document.getElementById('publishResult');
        resultDiv.classList.add('hidden');

        const productName = document.getElementById('productName').value;
        const interfaceName = document.getElementById('interfaceName').value;
        const interfaceType = document.getElementById('interfaceType').value;

        if (!productName || !interfaceName || !interfaceType) {
            showResult('Please fill in all required fields', 'error');
            return;
        }

        const request = {
            Name: interfaceName,
            ProductName: productName,
            InterfaceType: interfaceType,
            Description: document.getElementById('description').value,
            Host: document.getElementById('host')?.value,
            Port: document.getElementById('port')?.value,
            Endpoint: document.getElementById('endpoint')?.value,
            Username: document.getElementById('username')?.value,
            Password: document.getElementById('password')?.value,
            Token: document.getElementById('token')?.value,
            DatabaseName: document.getElementById('dbName')?.value,
            Scheme: document.getElementById('dbSchema')?.value,
            BootstrapServers: document.getElementById('bootstrapServers')?.value,
            TopicName: document.getElementById('topicName')?.value
        };

        try {
            const response = await fetch('/api/publication/interfaces', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(request)
            });

            if (response.ok) {
                const result = await response.json();
                showResult(`Interface published successfully! ID: ${result.interfaceId}`, 'success');
                clearForm();
                loadRecentInterfaces();
            } else {
                const error = await response.text();
                showResult(`Error: ${error}`, 'error');
            }
        } catch (error) {
            showResult(`Network error: ${error.message}`, 'error');
        }
    }

    function showResult(message, type) {
        const resultDiv = document.getElementById('publishResult');
        resultDiv.innerHTML = message;
        resultDiv.className = type === 'success'
            ? 'mt-4 p-3 rounded bg-green-100 text-green-700 border border-green-300'
            : 'mt-4 p-3 rounded bg-red-100 text-red-700 border border-red-300';
        resultDiv.classList.remove('hidden');
    }

    async function loadRecentInterfaces() {
        try {
            const response = await fetch('/api/publication/interfaces/recent');
            if (response.ok) {
                const interfaces = await response.json();
                displayRecentInterfaces(interfaces);
            }
        } catch (error) {
            console.error('Failed to load recent interfaces:', error);
        }
    }

    function displayRecentInterfaces(interfaces) {
        const container = document.getElementById('recentInterfaces');

        if (interfaces.length === 0) {
            container.innerHTML = '<div class="text-gray-500 text-center">No interfaces published yet</div>';
            return;
        }

        container.innerHTML = interfaces.map(intf => `
            <div class="border rounded-lg p-3">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-semibold">${intf.name}</h3>
                        <p class="text-sm text-gray-600">${intf.description || 'No description'}</p>
                    </div>
                    <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">
                        ${intf.interfaceType}
                    </span>
                </div>
                <div class="text-xs text-gray-500 mt-2">
                    Product: ${intf.productName} • Status: ${intf.status}
                </div>
            </div>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', function() {
        showInterfaceFields();
        loadRecentInterfaces();
    });
</script>
</body>
</html>
