<!DOCTYPE html>
<html lang="en">
<head>
    <title>Discovery - Integration Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-6">
    <header class="mb-8">
        <a href="/index.html" class="text-blue-500 hover:text-blue-700">← Back to Home</a>
        <h1 class="text-3xl font-bold mt-4">Discovery Service</h1>
    </header>

    <div class="bg-white p-6 rounded-lg shadow mb-8">
        <h2 class="text-xl font-semibold mb-4">Search Interfaces</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <input type="text" id="productSearch" placeholder="Product name" class="p-2 border rounded">
            <input type="text" id="interfaceSearch" placeholder="Interface name" class="p-2 border rounded">
            <select id="typeSearch" class="p-2 border rounded">
                <option value="">All types</option>
                <option value="Api">API</option>
                <option value="Db">Database</option>
                <option value="Kafka">Kafka</option>
            </select>
        </div>

        <button onclick="searchInterfaces()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
            Search
        </button>
    </div>

    <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-semibold mb-4">Search Results</h2>
        <div id="searchResults" class="space-y-4">
            <div class="text-gray-500 text-center">No results yet. Perform a search to see interfaces.</div>
        </div>
    </div>
</div>

<script>
    async function searchInterfaces() {
        const productName = document.getElementById('productSearch').value;
        const interfaceName = document.getElementById('interfaceSearch').value;
        const interfaceType = document.getElementById('typeSearch').value;

        try {
            const response = await fetch(`http://localhost:5002/api/Search/interfaces/advanced?` +
                `productName=${encodeURIComponent(productName)}&` +
                `interfaceName=${encodeURIComponent(interfaceName)}&` +
                `interfaceType=${encodeURIComponent(interfaceType)}`);

            const results = await response.json();
            displayResults(results);
        } catch (error) {
            document.getElementById('searchResults').innerHTML =
                `<div class="text-red-500">Error: ${error.message}</div>`;
        }
    }

    function displayResults(results) {
        const container = document.getElementById('searchResults');

        if (results.length === 0) {
            container.innerHTML = '<div class="text-gray-500 text-center">No interfaces found.</div>';
            return;
        }

        container.innerHTML = results.map(interface => `
            <div class="border rounded-lg p-4">
                <h3 class="font-semibold">${interface.name}</h3>
                <p class="text-gray-600">${interface.description || 'No description'}</p>
                <div class="flex justify-between items-center mt-2">
                    <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm">
                        ${interface.interfaceType}
                    </span>
                    <span class="bg-green-100 text-green-800 px-2 py-1 rounded text-sm">
                        ${interface.productName}
                    </span>
                    <span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-sm">
                        ${interface.connectionStatus}
                    </span>
                </div>
                <button onclick="subscribeToInterface(${interface.id})" 
                        class="mt-2 bg-purple-500 hover:bg-purple-600 text-white px-3 py-1 rounded text-sm">
                    Subscribe
                </button>
            </div>
        `).join('');
    }

    function subscribeToInterface(interfaceId) {
        window.location.href = `/subscription.html?interfaceId=${interfaceId}`;
    }
</script>
</body>
</html>
