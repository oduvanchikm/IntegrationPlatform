<!DOCTYPE html>
<html lang="en">
<head>
    <title>Publication Service - Integration Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Publication Service</h1>

    <div class="bg-white p-6 rounded-lg shadow mb-8">
        <h2 class="text-xl font-semibold mb-4">Publish New Interface</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <input type="text" id="productName" placeholder="Product Name*" class="p-2 border rounded" required>
            <input type="text" id="interfaceName" placeholder="Interface Name*" class="p-2 border rounded" required>
        </div>

        <textarea id="description" placeholder="Description" class="w-full p-2 border rounded mb-4" rows="2"></textarea>

        <select id="interfaceType" class="w-full p-2 border rounded mb-4" onchange="showInterfaceFields()">
            <option value="">Select Interface Type*</option>
            <option value="Api">API</option>
            <option value="Db">Database</option>
            <option value="Kafka">Kafka</option>
        </select>

        <div id="apiFields" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <input type="text" id="host" placeholder="Host" class="p-2 border rounded">
            <input type="text" id="port" placeholder="Port" class="p-2 border rounded">
            <input type="text" id="endpoint" placeholder="Endpoint" class="p-2 border rounded">
            <input type="text" id="username" placeholder="Username" class="p-2 border rounded">
            <input type="password" id="password" placeholder="Password" class="p-2 border rounded">
            <input type="text" id="token" placeholder="Token" class="p-2 border rounded">
        </div>

        <div id="dbFields" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <input type="text" id="dbHost" placeholder="Host" class="p-2 border rounded">
            <input type="text" id="dbPort" placeholder="Port" class="p-2 border rounded">
            <input type="text" id="dbName" placeholder="Database Name" class="p-2 border rounded">
            <input type="text" id="dbSchema" placeholder="Schema" class="p-2 border rounded">
            <input type="text" id="dbUsername" placeholder="Username" class="p-2 border rounded">
            <input type="password" id="dbPassword" placeholder="Password" class="p-2 border rounded">
        </div>

        <div id="kafkaFields" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <input type="text" id="bootstrapServers" placeholder="Bootstrap Servers" class="p-2 border rounded">
            <input type="text" id="topicName" placeholder="Topic Name" class="p-2 border rounded">
            <input type="text" id="kafkaUsername" placeholder="Username" class="p-2 border rounded">
            <input type="password" id="kafkaPassword" placeholder="Password" class="p-2 border rounded">
        </div>

        <button onclick="publishInterface()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
            Publish Interface
        </button>

        <div id="publishResult" class="mt-4"></div>
    </div>
</div>

<script>
    function showInterfaceFields() {
        const type = document.getElementById('interfaceType').value;
        document.getElementById('apiFields').classList.add('hidden');
        document.getElementById('dbFields').classList.add('hidden');
        document.getElementById('kafkaFields').classList.add('hidden');

        if (type === 'Api') document.getElementById('apiFields').classList.remove('hidden');
        if (type === 'Db') document.getElementById('dbFields').classList.remove('hidden');
        if (type === 'Kafka') document.getElementById('kafkaFields').classList.remove('hidden');
    }

    async function publishInterface() {
        const request = {
            Name: document.getElementById('interfaceName').value,
            ProductName: document.getElementById('productName').value,
            InterfaceType: document.getElementById('interfaceType').value,
            Description: document.getElementById('description').value,
            Host: document.getElementById('host')?.value,
            Port: document.getElementById('port')?.value,
            Endpoint: document.getElementById('endpoint')?.value,
            Username: document.getElementById('username')?.value,
            Password: document.getElementById('password')?.value,
            Token: document.getElementById('token')?.value,
            DatabaseName: document.getElementById('dbName')?.value,
            Scheme: document.getElementById('dbSchema')?.value,
            BootstrapServers: document.getElementById('bootstrapServers')?.value,
            TopicName: document.getElementById('topicName')?.value
        };

        try {
            const response = await fetch('/api/publication/interfaces', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(request)
            });

            const result = await response.json();

            if (result.success) {
                document.getElementById('publishResult').innerHTML =
                    `<div class="text-green-500">✅ ${result.message} (ID: ${result.interfaceId})</div>`;
                document.getElementById('interfaceName').value = '';
                document.getElementById('description').value = '';
                document.getElementById('interfaceType').value = '';
                showInterfaceFields();
            } else {
                document.getElementById('publishResult').innerHTML =
                    `<div class="text-red-500">Error: ${result.error}</div>`;
            }
        } catch (error) {
            document.getElementById('publishResult').innerHTML =
                `<div class="text-red-500">Request failed: ${error.message}</div>`;
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('apiFields').classList.add('hidden');
        document.getElementById('dbFields').classList.add('hidden');
        document.getElementById('kafkaFields').classList.add('hidden');
    });
</script>
</body>
</html>
