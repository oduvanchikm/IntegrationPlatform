services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - app-network
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - app-network
  
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - app-network
  
  mock-api-source:
    build:
      context: .
      dockerfile: IntegrationPlatform.MockApi/Dockerfile
    container_name: mock-api-source
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - app-network

  mock-api-target:
    build:
      context: .
      dockerfile: IntegrationPlatform.MockApi/Dockerfile
    container_name: mock-api-target
    ports:
      - "5101:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - app-network
  
  postgres:
    image: debezium/postgres:15
    container_name: integration-platform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5480:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - app-network
  
  postgres-source:
    image: debezium/postgres:15
    container_name: postgres-source
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: source_db
    ports:
      - "5481:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
      - ./init-source-db.sh:/docker-entrypoint-initdb.d/init-source-db.sh
    networks:
      - app-network

  postgres-target:
    image: debezium/postgres:15
    container_name: postgres-target
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: target_db
    ports:
      - "5482:5432"
    volumes:
      - postgres_target_data:/var/lib/postgresql/data
      - ./init-target-db.sh:/docker-entrypoint-initdb.d/init-target-db.sh
    networks:
      - app-network
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2189:2181"
    networks:
      - app-network
  
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9100:9100"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9100
      
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9100
      
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    healthcheck:
      test: [ "CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - zookeeper
    networks:
      - app-network
  
  connect:
    image: debezium/connect:2.4
    container_name: debezium-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      - kafka
      - postgres
    networks:
      - app-network
  
  zookeeper2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2190:2181"
    networks:
      - app-network

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka2
    ports:
      - "9200:9200"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper2:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9200
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,PLAINTEXT_HOST://localhost:9200

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    depends_on:
      - zookeeper2
    networks:
      - app-network
  
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    depends_on:
      - kafka
    networks:
      - app-network
  
  kafdrop2:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop2
    ports:
      - "9001:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka2:9092"
    depends_on:
      - kafka2
    networks:
      - app-network

  zookeeper3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2191:2181"
    networks:
      - app-network

  kafka33:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka33
    ports:
      - "9300:9300"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper3:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9300
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka33:9092,PLAINTEXT_HOST://localhost:9300

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    depends_on:
      - zookeeper3
    networks:
      - app-network
  
  kafdrop3:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop3
    ports:
      - "9002:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka33:9092"
    depends_on:
      - kafka33
    networks:
      - app-network

  publication-api:
    build:
      context: .
      dockerfile: IntegrationPlatform.Publication.API/Dockerfile
    container_name: publication-api
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PublicationDbContext=Host=postgres;Port=5432;Database=integration_platform;Username=admin;Password=password;Search Path=publication;Include Error Detail=true
      - Kafka__BootstrapServers=kafka2:9092
    depends_on:
      - postgres
      - kafka2
    ports:
      - "5001:8080"
    networks:
      - app-network
  
  search-api:
    build:
      context: .
      dockerfile: IntegrationPlatform.Search.API/Dockerfile
    container_name: search-api
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DiscoveryDbContext=Host=postgres;Port=5432;Database=integration_platform;Username=admin;Password=password;Search Path=publication
    depends_on:
      - postgres
    ports:
      - "5002:8080"
    networks:
      - app-network

  subscription-api:
    build:
      context: .
      dockerfile: IntegrationPlatform.Subscription.API/Dockerfile
    container_name: subscription-api
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__SubscriptionDbContext=Host=postgres;Port=5432;Database=integration_platform;Username=admin;Password=password;Search Path=subscription
    depends_on:
      - postgres
    ports:
      - "5003:8080"
    networks:
      - app-network
  
  engine:
    build:
      context: .
      dockerfile: IntegrationPlatform.Engine/Dockerfile
    container_name: integration-engine
    ports:
      - "8080:8080"
      - "9091:9091"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PublicationDbContext=Host=postgres;Port=5432;Database=integration_platform;Username=admin;Password=password;Search Path=publication
      - ConnectionStrings__SubscriptionDbContext=Host=postgres;Port=5432;Database=integration_platform;Username=admin;Password=password;Search Path=subscription
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__GroupId=engine-service
      - Kafka__Topic=debezium.subscription.OrchestrationConfig

      - KafkaSource__BootstrapServers=kafka2:9092
      - KafkaSource__Topic=source-topic

      - KafkaTarget__Topic=target-topic
      - KafkaTarget__BootstrapServers=kafka33:9092
    depends_on:
      - postgres
      - kafka
      - kafka2
      - kafka33
      - connect
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_source_data:
  postgres_target_data:
  grafana_data:
  loki_data:
  prometheus_data: